function mathQuestion(g,t,d,i){const a=2+i+d,b=3+d;let text,ans,exp,rule;

if(g===10){if(t===0){text=`Вычисли ${a} × (sin² ${20+i*5}° + cos² ${20+i*5}°).`;ans=a;exp=`sin²α + cos²α = 1. Поэтому ${a} × 1 = ${a}.`;rule='Основное тригонометрическое тождество.'}if(t===1){text=`Вычисли log₂ ${2**(i+2)}.`;ans=i+2;exp=`2 в степени ${i+2} равно ${2**(i+2)}, поэтому логарифм равен ${i+2}.`;rule='Логарифм показывает, в какую степень возвести основание.'}if(t===2){text=`f(x) = ${b}x². Найди f′(${a}).`;ans=2*b*a;exp=`f′(x) = ${2*b}x. f′(${a}) = ${2*b} × ${a} = ${ans}.`;rule='Производная x² равна 2x.'}if(t===3){text=`Площадь основания прямой призмы ${a*b} см², высота ${a} см. Найди объём.`;ans=a*a*b;exp=`V = S основания × h = ${a*b} × ${a} = ${ans} см³.`;rule='Объём призмы равен площади основания, умноженной на высоту.'}}

function numeric(s){s=String(s).trim().replace(',','.');if(/^[-+]?\d+(\.\d+)?\s*\/\s*[-+]?\d+(\.\d+)?$/.test(s)){let [a,b]=s.split('/').map(Number);return b? a/b:NaN}return s!==''&&/^[-+]?\d+(\.\d+)?$/.test(s)?Number(s):NaN}
function matches(a,b){let x=numeric(a),y=numeric(b);return Number.isFinite(x)&&Number.isFinite(y)?Math.abs(x-y)<0.00051:norm(a)===norm(b)}
function check(){if(!run||run.solved||run.ended)return;let q=run.qs[run.index];if(!run.selection.trim())return toast('Сначала выбери или введи ответ.');let id=key(run.topic)+':'+state.difficulty+':'+run.index;let rec=state.records[id]||{attempts:0,errors:0,solved:false,title:topics()[run.topic].title};rec.attempts++;if(matches(run.selection,q.answer)){if(!run.wrong&&!run.explained)run.first++;run.solved=true;let award=!state.won.includes(id)&&!run.explained;if(award){state.xp+=Math.max(5,Math.round((20+state.difficulty*5-run.hints*4)*(run.wrong?.5:1)));state.rating+=run.wrong?6:12;state.won.push(id)}rec.solved=true;state.records[id]=rec;save();sidebar();document.getElementById('feedback').innerHTML=`<div class="feedback"><h3>Верно! Фрагмент восстановлен.</h3><p>${esc(q.explain)}</p>${award?'':'<small>Повторное решение или решение после разбора: без новых очков.</small>'}</div>`;document.getElementById('next').innerHTML='<button onclick="next()">Продолжить →</button>';document.querySelectorAll('.answers button,#answer').forEach(el=>el.disabled=true)}else{run.wrong=true;run.energy--;state.rating=Math.max(0,state.rating-8);rec.errors++;state.records[id]=rec;save();sidebar();if(run.energy===0){run.ended=true;document.getElementById('feedback').innerHTML=`<div class="feedback error"><h3>Экспедиция завершилась. Команда вернулась в лагерь.</h3><p>Ключи сохранены. Разбор: ${esc(q.explain)}</p><p>Точность первых ответов: ${Math.round(run.first/run.qs.length*100)}%. Попробуй более лёгкую сложность или начни заново.</p></div>`;document.getElementById('next').innerHTML=`<button onclick="start(${run.topic})">Попробовать снова</button>`}else document.getElementById('feedback').innerHTML='<div class="feedback error"><h3>Пока не совпало. Найдём другой путь.</h3><p>Перепроверь правило, знак, порядок действий или точность термина. Возьми подсказку и попробуй снова.</p></div>'}}
function hint(){let max=Math.max(0,Math.min(3,4-state.difficulty));if(run.solved||run.ended||run.hints>=max)return;run.hints++;renderQuest()}
function explain(){if(!run.solved){run.explained=true;run.wrong=true}document.getElementById('feedback').innerHTML=`<div class="feedback"><h3>Разбор решения</h3><p>${esc(run.qs[run.index].explain)}</p><small>После просмотра разбора исправь ответ. Это тренировка без начисления очков.</small></div>`}
function next(){if(!run.solved)return;if(run.index<run.qs.length-1){run.index++;run.hints=0;run.wrong=false;run.solved=false;run.explained=false;run.selection='';renderQuest();return}let pct=Math.round(run.first/run.qs.length*100),pass=pct>=state.settings.threshold;if(pass&&!state.keys.includes(key(run.topic)))state.keys.push(key(run.topic));save();sidebar();document.getElementById('main').innerHTML=`<div class="quest card">${portrait(0)}<span class="eyebrow">${pass?'Остров восстановлен':'Тренировка завершена'}</span><h1>${pass?'Ключ памяти — твой!':'Ты уже знаешь больше.'}</h1><p>Точность первых ответов: ${pct}%. Порог: ${state.settings.threshold}%. Все задания исправлены.</p><p>${pass?['В журнале обнаружен след: год не исчез — его страницы рассыпались по островам.','Мост восстановлен. Команда нашла страницу о доброте и взаимной помощи.','Сад снова цветёт. Его хранители сохранили воспоминания о каждом открытии.','Маяк зажёгся: память мира возвращается благодаря твоим знаниям.'][run.topic%4]:'Чтобы получить ключ, повтори тему и набери нужную точность. Подсказки можно использовать.'}</p><div class="row"><button onclick="show('map')">Вернуться на карту</button><button class="ghost" onclick="start(${run.topic})">Повторить тему</button></div></div>`}
function finale(){if(!topics().every((t,i)=>state.keys.includes(key(i))))return;document.getElementById('main').innerHTML=`<div class="quest card"><span class="eyebrow">Тайна потерянного года</span><h1>Последняя страница</h1><p>Год распался на воспоминания, когда жители перестали делиться открытиями. Ты вернул знания каждому острову. Что связывает их и помогает снова учиться вместе?</p><div class="answers"><button onclick="finish(false)">Страх ошибок</button><button onclick="finish(true)">Любознательность и взаимная помощь</button><button onclick="finish(false)">Соревнование любой ценой</button></div><div id="finalfeedback" aria-live="polite"></div></div>`}
function finish(ok){if(!ok){document.getElementById('finalfeedback').innerHTML='<p class="notice">Вспомни, как команда помогала тебе после ошибок. Попробуй снова.</p>';return}let id=prefix();if(!state.won.includes('final'+id)){state.won.push('final'+id);state.xp+=100;save()}sidebar();document.getElementById('main').innerHTML=`<div class="quest card">${portrait(0)}<span class="eyebrow">История восстановлена</span><h1>Год снова с нами.</h1><p>Потерянный год был годом открытий. Каждый твой шаг вернул его миру. Знания становятся сильнее, когда ими делятся.</p><span class="badge">✦ Хранитель памяти</span><p>Финальный бонус: 100 очков, один раз за маршрут.</p><button onclick="show('map')">В новое путешествие →</button></div>`}
function renderCrew(){document.getElementById('main').innerHTML=`<span class="eyebrow">Пять героев · одна история</span><h1>Команда твоих открытий</h1><p class="muted">Оригинальные персонажи Архипелага. Каждый хранит свою стратегию обучения.</p><div class="crew">${CREW.map((c,i)=>`<div class="card">${portrait(i)}<h2>${c[0]}</h2><p>${c[1]}</p><p>${c[2]}</p><small>«${c[3]}»</small></div>`).join('')}</div>`}
function download(name,data,type='application/json'){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function renderTeacher(){let records=Object.entries(state.records);document.getElementById('main').innerHTML=`<span class="eyebrow">Мастерская репетитора</span><h1>Настрой путешествие</h1><p class="muted">${SUBJECTS.find(s=>s[0]===state.subject)[1]}, ${state.grade} класс. Выбери другой маршрут на карте. Примерный план требует сверки с вашим учебником; вводная химия 5–7 классов — дополнительный курс.</p><div class="card"><h2>Правила экспедиции</h2><div class="filters"><label>Заданий за проход<input id="count" type="number" min="3" max="8" value="${state.settings.count}"></label><label>Порог ключа, %<input id="threshold" type="number" min="50" max="100" value="${state.settings.threshold}"></label></div><button onclick="saveSettings()">Сохранить настройки</button></div><div class="card" style="margin-top:18px"><h2>Темы и задания</h2><p>Редактируй JSON: порядок объектов — порядок островов. Можно добавлять и удалять темы. В каждой теме пять массивов levels (пять сложностей), в каждом 3–8 заданий. text — условие, answer — ответ, explain — разбор, hints — три подсказки, choices — необязательные варианты. Изменение маршрута сбрасывает его ключи, чтобы они соответствовали новым заданиям.</p><label for="editor">Редактор текущего маршрута</label><textarea id="editor" class="editor" spellcheck="false">${esc(JSON.stringify(topics(),null,2))}</textarea><div class="row"><button onclick="saveEditor()">Применить учебный план</button><button class="ghost" onclick="download('учебный-план.json',document.getElementById('editor').value)">Скачать план</button></div></div><div class="card" style="margin-top:18px"><h2>Личный отчёт ученика</h2><p>Ключи: ${state.keys.map(esc).join(', ')||'ещё не собраны'}. Это отчёт этого устройства, без доступа к другим ученикам.</p><table><thead><tr><th>Маршрут / тема</th><th>Попытки</th><th>Ошибки</th><th>Результат</th></tr></thead><tbody>${records.slice(-60).map(([id,r])=>`<tr><td>${esc(id)} · ${esc(r.title)}</td><td>${r.attempts}</td><td>${r.errors}</td><td>${r.solved?'Исправлено':'В работе'}</td></tr>`).join('')||'<tr><td colspan="4">Первые результаты появятся после задания.</td></tr>'}</tbody></table><div class="row"><button class="ghost" onclick="download('прогресс.json',JSON.stringify(state,null,2))">Экспорт прогресса</button><button class="ghost" onclick="resetProgress()">Сбросить прогресс</button></div><small>Экспорт сохраняет резервную копию. Для восстановления на этом устройстве выбери файл ниже.</small><label style="display:block">Восстановить прогресс<input type="file" accept="application/json,.json" onchange="importProgress(this.files[0])"></label></div><details><summary>Как использовать в Telegram</summary><p>Этот файл работает самостоятельно. Для Mini App размести его на HTTPS, создай бота через BotFather и укажи ссылку на приложение в настройках кнопки меню. Telegram-авторизация, облачный прогресс, рассылки и общий кабинет репетитора потребуют серверной части. Не размещай токен бота в HTML.</p></details>`}
function saveSettings(){let c=Number(document.getElementById('count').value),t=Number(document.getElementById('threshold').value);if(!Number.isInteger(c)||c<3||c>8||!Number.isFinite(t)||t<50||t>100)return toast('Нужно 3–8 заданий и порог 50–100%.');state.settings={count:c,threshold:t};save();toast('Настройки сохранены')}
function validTopics(data){
 if(!Array.isArray(data)||!data.length||data.length>40)return false;
 return data.every(t=>typeof t.title==='string'&&Array.isArray(t.levels)&&t.levels.length===5&&t.levels.every(qs=>Array.isArray(qs)&&qs.length>=3&&qs.length<=8&&qs.every(q=>{
 if(typeof q.text!=='string'||typeof q.answer!=='string'||!q.answer.trim()||typeof q.explain!=='string'||!Array.isArray(q.hints)||q.hints.length!==3||!q.hints.every(h=>typeof h==='string'))return false;
 return !q.choices||(Array.isArray(q.choices)&&q.choices.length>=2&&q.choices.every(c=>typeof c==='string')&&new Set(q.choices).size===q.choices.length&&q.choices.includes(q.answer));
 })));
}
function saveEditor(){try{let data=JSON.parse(document.getElementById('editor').value);if(!validTopics(data))throw Error('Проверь структуру, 5 сложностей, 3–8 заданий и 3 подсказки. Ответ должен присутствовать среди вариантов.');if(!confirm('Применить изменения и сбросить ключи и отчёт этого маршрута?'))return;let p=prefix();state.custom[p]=data;state.keys=state.keys.filter(k=>!k.startsWith(p+':'));state.won=state.won.filter(k=>!k.startsWith(p+':')&&k!=='final'+p);for(let k of Object.keys(state.records))if(k.startsWith(p+':'))delete state.records[k];save();renderTeacher();sidebar();toast('Учебный план обновлён')}catch(e){toast('Не сохранено: '+e.message)}}
function resetProgress(){if(!confirm('Сбросить весь игровой прогресс? Учебные планы и настройки сохранятся. Экспортируй резервную копию перед сбросом.'))return;state.xp=0;state.rating=100;state.keys=[];state.records={};state.won=[];run=null;save();show('teacher');toast('Прогресс сброшен')}
async function importProgress(file){if(!file)return;try{let s=JSON.parse(await file.text());if(![5,6,7,8,9,10,11].includes(s.grade)||!SUBJECTS.some(x=>x[0]===s.subject)||!Number.isInteger(s.difficulty)||s.difficulty<0||s.difficulty>4||!Number.isFinite(s.xp)||s.xp<0||!Number.isFinite(s.rating)||s.rating<0||!Array.isArray(s.keys)||!s.keys.every(x=>typeof x==='string')||!Array.isArray(s.won)||!s.won.every(x=>typeof x==='string')||!s.settings||!Number.isInteger(s.settings.count)||s.settings.count<3||s.settings.count>8||s.settings.threshold<50||s.settings.threshold>100||!s.records||!Object.values(s.records).every(r=>typeof r.title==='string'&&Number.isFinite(r.attempts)&&Number.isFinite(r.errors))||!s.custom||!Object.values(s.custom).every(validTopics))throw Error('Неподходящий формат резервной копии');if(!confirm('Заменить текущий прогресс данными из файла?'))return;state=s;run=null;save();show('teacher');toast('Прогресс восстановлен')}catch(e){toast('Не удалось восстановить: '+e.message)}}
show('map');
</script></body></html>
